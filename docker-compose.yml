# XGenius — Phase 3. From repo root: `docker compose up --build`
# API: http://localhost:8000  ·  OpenAPI: http://localhost:8000/docs
#
# First boot may be slow: models are trained and saved to `backend/artifacts` if the image has none.

services:
  xgenius-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: xgenius-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
